name: Deploy to GitHub Pages and CloudBase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "site-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pyyaml openpyxl

      # 关键：先跑你的脚本（xlsx->cases_raw->生成 docs/cases/ 等）
      - name: Build cases pages
        run: |
          python scripts/build_cases.py

      # 再构建 mkdocs 静态站点到 site/
      - name: Build MkDocs site
        run: |
          mkdocs build --strict

      - name: Verify private sources are excluded
        run: |
          if find site -type f -iname '*.xlsx' | grep -q .; then
            echo "Build output contains private .xlsx files" >&2
            exit 1
          fi

      - name: Upload CloudBase artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-site
          path: site
          if-no-files-found: error
          retention-days: 1

      # GitHub Pages 官方推荐的发布流程：上传构建产物
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudbase:
    name: Deploy to CloudBase
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      CLOUDBASE_ENV_ID: sms-teacher-ranking-d4bd8db87b87
      CLOUDBASE_PATH: /sz-feiyue/
      CLOUDBASE_ROOT_URL: https://sms-teacher-ranking-d4bd8db87b87-1331414357.tcloudbaseapp.com/
      CLOUDBASE_URL: https://sms-teacher-ranking-d4bd8db87b87-1331414357.tcloudbaseapp.com/sz-feiyue/
    steps:
      - name: Checkout root entry
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudbase-site
          path: site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CloudBase CLI
        run: |
          npm install --global @cloudbase/cli@3.7.0
          tcb --version

      - name: Authenticate CloudBase CLI
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          test -n "$TENCENTCLOUD_SECRET_ID"
          test -n "$TENCENTCLOUD_SECRET_KEY"
          tcb login --apiKeyId "$TENCENTCLOUD_SECRET_ID" --apiKey "$TENCENTCLOUD_SECRET_KEY"

      - name: Upload complete site to CloudBase
        run: tcb hosting deploy ./site "$CLOUDBASE_PATH" --env-id "$CLOUDBASE_ENV_ID" --concurrency 1 --yes

      - name: Upload CloudBase root entry
        run: tcb hosting deploy ./cloudbase-root/index.html /index.html --env-id "$CLOUDBASE_ENV_ID" --concurrency 1 --yes

      - name: Verify CloudBase files
        run: |
          tcb hosting list --env-id "$CLOUDBASE_ENV_ID" --json > hosting-files.json
          node - <<'NODE'
          const fs = require("node:fs");
          const listing = JSON.parse(fs.readFileSync("hosting-files.json", "utf8"));
          const paths = new Set();

          function collectPaths(value) {
            if (typeof value === "string") {
              try {
                paths.add(new URL(value).pathname);
              } catch {
                paths.add(`/${value.replace(/^\/+/, "")}`);
              }
              return;
            }
            if (Array.isArray(value)) {
              value.forEach(collectPaths);
              return;
            }
            if (value && typeof value === "object") {
              Object.values(value).forEach(collectPaths);
            }
          }

          collectPaths(listing);
          const requiredPaths = [
            "/index.html",
            `${process.env.CLOUDBASE_PATH}index.html`,
            `${process.env.CLOUDBASE_PATH}404.html`,
          ];
          const missingPaths = requiredPaths.filter((path) => !paths.has(path));
          if (missingPaths.length > 0) {
            console.error(`CloudBase hosting is missing: ${missingPaths.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Verify CloudBase index content
        run: |
          set -o pipefail
          root_local_sha256="$(sha256sum cloudbase-root/index.html | awk '{print $1}')"
          root_remote_sha256="$(
            curl --fail --show-error --silent \
              --retry 5 --retry-delay 5 \
              --connect-timeout 5 --max-time 20 \
              "${CLOUDBASE_ROOT_URL}index.html?build=${GITHUB_SHA}" \
              | sha256sum | awk '{print $1}'
          )"
          test "$root_local_sha256" = "$root_remote_sha256"

          local_sha256="$(sha256sum site/index.html | awk '{print $1}')"
          remote_sha256="$(
            curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 \
              --connect-timeout 5 --max-time 20 \
              "${CLOUDBASE_URL}index.html?build=${GITHUB_SHA}" \
              | sha256sum | awk '{print $1}'
          )"
          test "$local_sha256" = "$remote_sha256"
